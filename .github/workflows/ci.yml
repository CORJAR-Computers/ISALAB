# =============================================================================
# IsaLab — CI/CD pipeline
# Se ejecuta en cada push y Pull Request a main / develop.
# =============================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Lint + Formato + Type-check (rápido, corre en todos los OS)
  # ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.5.7 black==24.8.0 mypy==1.11.2

      - name: Ruff check
        run: ruff check .

      - name: Black --check
        run: black --check .

      - name: Mypy (no bloqueante al inicio)
        continue-on-error: true
        run: mypy --ignore-missing-imports database services utils || true

  # ─────────────────────────────────────────────────────────────────────
  # Tests (matriz de versiones de Python)
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
          # WeasyPrint necesita Pango + PangoFT2

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        run: pytest --cov --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────────────
  # Build del ejecutable (solo Windows, solo en main)
  # ─────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build .exe (Windows)
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: python build_app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IsaLab-windows-exe
          path: dist/IsaLab/
          retention-days: 14
