<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Documento Clínico{% endblock %}</title>
    <style>
        /* --- CONFIGURACIÓN DE PÁGINA (PAGINACIÓN AUTOMÁTICA) --- */
        @page {
            size: A4;
            /* Margen superior ajustado a 3.5cm para darle espacio al Logo */
            margin: 3.5cm 2cm 2.5cm 2cm;

            /* Encabezado automático en todas las hojas */
            @top-center {
                content: element(header);
            }
            /* Pie de página con numeración dinámica */
            @bottom-center {
                content: "IsaLab Centro Diagnóstico Veterinario | Página " counter(page);
                font-family: 'Helvetica', sans-serif;
                font-size: 8pt;
                color: #64748b;
                border-top: 1px solid #e2e8f0;
                padding-top: 5px;
            }
        }

        /* --- ESTILOS GENERALES CORPORATIVOS --- */
        body {
            font-family: 'Helvetica', sans-serif;
            color: #1e293b;
            font-size: 10pt;
            line-height: 1.5;
        }

        /* El header se "captura" para repetirlo en @page */
        div.header {
            position: running(header);
            width: 100%;
            border-bottom: 3px solid #3BADE5;
            padding-bottom: 10px;
            margin-bottom: 20px;
            padding-top: 0.5cm;
        }

        .header h1 {
            color: #1E3A5F;
            font-size: 18pt;
            margin: 0;
            text-transform: uppercase;
        }

        .header p {
            color: #64748b;
            font-size: 9pt;
            margin: 2px 0 0 0;
        }

        /* --- TIPOGRAFÍA Y TABLAS --- */
        h2 { color: #3BADE5; font-size: 13pt; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; margin-top: 25px; }
        h3 { color: #1E3A5F; font-size: 11pt; margin-bottom: 5px; }

        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th { text-align: left; font-size: 8pt; color: #94a3b8; text-transform: uppercase; padding: 4px 8px; border-bottom: 1px solid #e2e8f0; }
        td { padding: 8px; font-size: 10pt; vertical-align: top; }

        .tabla-limpia td { border-bottom: 1px solid #f1f5f9; }

        /* --- CLASES DE UTILIDAD PARA PDF --- */
        .evitar-corte { page-break-inside: avoid; }
        .salto-pagina { page-break-before: always; }

        /* --- SECCIÓN FIRMAS --- */
        .firma-container { margin-top: 2cm; text-align: center; }
        .firma-linea { border-top: 1px solid #1e293b; width: 6cm; margin: 0 auto; padding-top: 5px; }
        .firma-nombre { font-weight: bold; font-size: 11pt; }
        .firma-rol { font-size: 9pt; color: #64748b; }
    </style>
</head>
<body>

    <div class="header">
        <table style="width: 100%; border: none; margin-bottom: 0;">
            <tr>
                <td style="width: 70px; border: none; padding: 0; vertical-align: middle;">
                    <img src="logo_Isalab.png" style="width: 60px; height: auto;">
                </td>
                <td style="border: none; padding: 0; vertical-align: middle; text-align: left;">
                    <h1>IsaLab</h1>
                    <p>Centro Diagnóstico Veterinario Avanzado | Tel: (xxx) xxx-xxxx | www.isalab.com</p>
                </td>
            </tr>
        </table>
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
