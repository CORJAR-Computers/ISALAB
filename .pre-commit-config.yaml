# =============================================================================
# IsaLab — Pre-commit hooks
# Instalación:  pre-commit install
# Ejecutar:     pre-commit run --all-files
# =============================================================================
repos:
  # Ruff: lint + format (reemplaza flake8 + isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Black: formatter complementario
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3

  # Verificaciones estándar
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]  # bloquear archivos >500 KB
      - id: check-ast
      - id: debug-statements
      - id: detect-private-key  # nunca commitear llaves SSH/PEM
      - id: check-case-conflict  # предупреждает о Windows/Linux case issues

  # Mypy: type-checking (warning, no bloqueante al inicio)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML]
        args: [--ignore-missing-imports, --no-strict-optional]
        verbose: true
        # No bloquear commits por errores de mypy hasta que la base
        # de código esté completamente tipeada.
        stages: [manual]
